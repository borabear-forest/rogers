<style>

  h1 { font-family:'Noto Serif KR', serif; font-size:28px; line-height:1.35; margin-bottom:8px; }
  .desc { color:var(--muted); font-size:13px; }
  .tabs { position:sticky; top:0; z-index:20; display:flex; gap:8px; padding:10px 0; background:var(--cream); border-bottom:1px solid var(--line); }
  .tab-btn { flex:1; border:1px solid var(--line); background:#fff; padding:12px 10px; border-radius:999px; font-weight:700; cursor:pointer; color:var(--muted); font-family:'Noto Sans KR', sans-serif; }
  .tab-btn.active { color:#fff; background:var(--accent); border-color:var(--accent); }
  .panel { display:none; padding-top:18px; }
  .panel.active { display:block; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .btn { border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:8px; padding:8px 13px; font-weight:700; font-family:'Noto Sans KR', sans-serif; cursor:pointer; }
  .btn.sub { background:transparent; color:var(--ink); }
  .note { font-size:12px; color:var(--muted); }
  .summary-card, .quiz-card { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.035); }

  /* 개념요약 표 */
  .summary-content { font-size:12px; }
  .summary-content table { width:100%; border-collapse:collapse; margin-bottom:20px; table-layout:fixed; background:#fff; }
  .summary-content th, .summary-content td { border:1px solid #777; padding:6px 8px; vertical-align:top; line-height:1.75; }
  .summary-content .section-header { background:#3a3a3a; color:#fff; font-weight:700; font-size:13px; text-align:left; padding:8px; letter-spacing:.6px; }
  .summary-content .cat-main { background:#6b7a6b; color:#fff; font-weight:700; font-size:11px; text-align:center; vertical-align:middle; width:8%; word-break:keep-all; }
  .summary-content .cat-sub { background:#dde4dd; font-weight:700; font-size:11px; vertical-align:top; width:20%; word-break:keep-all; padding:6px 7px; }
  .summary-content .cat-sub-en { font-weight:400; font-size:9px; display:block; color:#555; margin-top:1px; word-break:break-all; }
  .summary-content .cat-content { background:#fff; font-size:12px; width:72%; }
  .summary-content ul { padding-left:17px; margin:0; }
  .summary-content li { margin-bottom:3px; }
  .summary-content .hl, .summary-content .sub { font-weight:700; }
  .summary-content .flow-box { border:1px solid #999; background:#f5f5f5; padding:8px 12px; margin-top:3px; font-size:11px; line-height:2; }

  /* 연습문제 */
  .quiz-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; color:var(--muted); font-size:12px; }
  .progress { height:8px; background:var(--soft2); border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .progress span { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .qnum { font-family:'Noto Serif KR', serif; color:var(--accent2); font-weight:700; margin-bottom:8px; }
  .question { font-size:17px; font-weight:700; line-height:1.65; margin-bottom:14px; white-space:pre-line; }
  .box { background:var(--soft); border-left: none; padding:12px 14px; margin-bottom:14px; border-radius:8px; white-space:pre-line; font-size:14px; }
  .options { display:flex; flex-direction:column; gap:8px; }
  .opt { text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px 12px; cursor:pointer; font-family:'Noto Sans KR', sans-serif; line-height:1.55; }
  .opt:hover { border-color:var(--accent); }
  .opt.correct { border-color:var(--accent); background:var(--soft); font-weight:700; }
  .opt.wrong { border-color:var(--wrong); background:#fff2f1; }
  .exp { display:none; margin-top:14px; padding:13px 14px; border-radius:10px; background:#fff8ee; border-left: none; white-space:pre-line; font-size:13px; }
  .exp.show { display:block; }
  .nav { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
  .all-list { margin-top:24px; display:none; }
  .all-list.show { display:block; }
  .all-q { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .all-q h3 { font-size:14px; margin-bottom:8px; }
  .answer { color:var(--wrong); font-weight:700; margin-top:8px; white-space:pre-line; }
  .model-figure { margin-top:24px; text-align:center; width:100%; max-width:100%; overflow:hidden; }
  .model-figure-img { width:100%; max-width:920px; height:auto; border:1px solid #ddd; border-radius:10px; display:block; margin:0 auto; }
  .model-figure-caption { margin-top:8px; font-size:11px; color:#9a958d; font-weight:400; line-height:1.5; }


  @media (max-width:680px) {

    .wrap { width:100%; max-width:100%; padding:18px 8px 64px; overflow-x:hidden; }

    /* 모바일: 기기 폭에 맞춰 표 전체가 유동적으로 줄어들게 함 */
    .summary-content {
      width:100%;
      max-width:100%;
      overflow-x:visible;
      font-size:clamp(7.8px, 2.45vw, 10.5px);
    }
    .summary-content table {
      width:100%;
      max-width:100%;
      min-width:0 !important;
      table-layout:fixed;
    }
    .summary-content col:nth-child(1) { width:9% !important; }
    .summary-content col:nth-child(2) { width:24% !important; }
    .summary-content col:nth-child(3) { width:67% !important; }
    .summary-content th,
    .summary-content td {
      padding:4px 4px;
      line-height:1.55;

      overflow-wrap:anywhere;

    .summary-content .cat-main { font-size:clamp(7.2px, 2.1vw, 9px); word-break:break-all; padding:4px 2px; }
    .summary-content .cat-sub { font-size:clamp(7.4px, 2.2vw, 9.5px); word-break:keep-all; overflow-wrap:anywhere; padding:4px 3px; }
    .summary-content .cat-sub-en { font-size:clamp(6.5px, 1.85vw, 8px); }
    .summary-content .cat-content { font-size:clamp(7.8px, 2.35vw, 10px); }
    .summary-content ul { padding-left:13px; }
    .summary-content .flow-box { font-size:clamp(7px, 2.1vw, 9.5px); padding:5px 6px; line-height:1.65; }
    .summary-content img { max-width:100%; height:auto; }

    .model-figure { margin-top:18px; overflow:hidden; }
    .model-figure-img { width:100%; max-width:100%; border-radius:8px; }
    .model-figure-caption { font-size:clamp(9px, 2.4vw, 11px); }
    .question { font-size:15px; }
  }
  @media print {
    body { background:#fff; } .wrap { max-width:none; padding:0; } .tabs,.toolbar,.nav,.progress { display:none!important; }

let current = 0;
let answered = new Set();
let selectedAnswers = {};

function renderQuiz() {
  const item = PQ_DATA[current];
  document.getElementById('counter').textContent = `${current + 1} / ${PQ_DATA.length}`;
  document.getElementById('bar').style.width = `${((current + 1) / PQ_DATA.length) * 100}%`;
  document.getElementById('qnum').textContent = `Q${current + 1}`;
  document.getElementById('question').textContent = item.q.replace(/^\d+\.\s*/, '');
  const box = document.getElementById('box');
  if (item.box) { box.style.display = 'block'; box.textContent = item.box; }
  else { box.style.display = 'none'; box.textContent = ''; }
  const box2 = document.getElementById('box2');
  if (item.box2) { box2.style.display = 'block'; box2.textContent = item.box2; }
  else { box2.style.display = 'none'; box2.textContent = ''; }
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  item.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<strong>${i + 1}.</strong> ${opt}`;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  const exp = document.getElementById('exp');
  exp.className = 'exp';
  exp.textContent = item.exp;
  if (answered.has(current)) showAnswer();
}

function choose(i) {
  answered.add(current);
  selectedAnswers[current] = i;
  showAnswer(i);
}

function showAnswer(chosen) {
  const item = PQ_DATA[current];
  const selected = chosen !== undefined ? chosen : selectedAnswers[current];

  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('correct', 'wrong');

    // 정답 선택지는 항상 녹색
    if (i === item.answer) {
      b.classList.add('correct');
    }

    // 사용자가 고른 선택지가 정답이 아니면, 사용자가 고른 선택지는 빨간색
    if (selected !== undefined && i === selected && i !== item.answer) {
      b.classList.add('wrong');
    }
  });

  document.getElementById('exp').classList.add('show');
}

function moveQ(delta) {
  current = Math.max(0, Math.min(PQ_DATA.length - 1, current + delta));
  renderQuiz();
  document.getElementById('quiz').scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleAll() {
  const list = document.getElementById('allList');
  list.classList.toggle('show');
  if (!list.dataset.rendered) {
    list.innerHTML = PQ_DATA.map((item, idx) => `
      <div class="all-q">
        <h3>Q${idx + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</h3>
        ${item.box ? `<div class="box">${item.box}</div>` : ''}
        ${item.box2 ? `<div class="box" style="margin-top:6px; background:#f5f0e8;">${item.box2}</div>` : ''}
        <ol>${item.opts.map(o => `<li>${o}</li>`).join('')}</ol>
        <div class="answer">정답: ${item.answer + 1}번
${item.exp}</div>
      </div>`).join('');
    list.dataset.rendered = '1';
  }
}

document.addEventListener('DOMContentLoaded', renderQuiz);
